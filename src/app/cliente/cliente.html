<div class="container-fluid">
    <h4 class="w-25  text-center">Accesorios</h4>
    <div class="row">

        <!-- ACCESORIOS -->
        <div class="col-md-3">


            @for(
            accesorio of configuracion();
            track accesorio.accesorioId
            ){

            <button type="button" class="btn btn-outline-primary w-100 mb-2 d-flex flex-column align-items-center"
                (click)="agregarAccesorio(accesorio)" [disabled]="estaSeleccionado(accesorio.accesorioId)">

                <img [src]="accesorio.imagen" width="70" height="70" class="mb-2 object-fit-contain">

                {{ accesorio.nombre }}

            </button>

            }

        </div>


        <!-- PRODUCTO -->
        <div class="col-md-9">

            <div class="visor">

                <img src="productos/maceta.png" class="maceta">

                @for (
                accesorio of accesoriosSeleccionados();
                track accesorio.id
                ) {

                <img [src]="accesorio.imagen" class="accesorio-colocado" [style.left.px]="accesorio.x"
                    [style.top.px]="accesorio.y" [style.width.px]="accesorio.ancho" [style.height.px]="accesorio.alto">

                }

            </div>

        </div>

    </div>

</div>
